name: CI Badges

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Reports must live next to go.mod: verbose tests + coverage; append cover -func so the last % is global.
      - name: Run tests with coverage
        run: |
          set -euo pipefail
          go test ./... -v -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test.out
          go tool cover -func=coverage.out >> test.out

      - name: CI Badges
        uses: gaelgirodon/ci-badges-action@v1.9.0
        with:
          gist-id: ${{ secrets.GIST_ID }}
          token: ${{ secrets.GIST_TOKEN }}
